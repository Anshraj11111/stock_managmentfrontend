<svg width="180" height="180" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Black Background -->
  <rect width="1024" height="1024" fill="#000000"/>
  
  <!-- A5x Logo -->
  <g transform="translate(512, 512)">
    <!-- Large A with gradient -->
    <defs>
      <linearGradient id="aGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#a0a0a0;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#606060;stop-opacity:1" />
      </linearGradient>
    </defs>
    
    <!-- Main A shape -->
    <path d="M-150,-200 L0,-350 L150,-200 L100,-50 L-100,-50 Z" fill="url(#aGradient)" opacity="0.9"/>
    
    <!-- Large A letter -->
    <text x="0" y="-80" font-family="Arial, sans-serif" font-size="280" font-weight="bold" fill="#808080" text-anchor="middle" dominant-baseline="middle">A</text>
    
    <!-- 5x Text with horizontal lines -->
    <g transform="translate(0, 120)">
      <!-- Horizontal lines through 5x -->
      <line x1="-80" y1="-20" x2="80" y2="-20" stroke="#606060" stroke-width="8"/>
      <line x1="-80" y1="0" x2="80" y2="0" stroke="#606060" stroke-width="8"/>
      <line x1="-80" y1="20" x2="80" y2="20" stroke="#606060" stroke-width="8"/>
      
      <!-- 5x text -->
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="180" font-weight="bold" fill="#808080" text-anchor="middle" dominant-baseline="middle">5x</text>
    </g>
    
    <!-- Orbital Rings -->
    <ellipse cx="0" cy="-50" rx="280" ry="350" fill="none" stroke="#707070" stroke-width="12" stroke-dasharray="30,15" opacity="0.7"/>
    
    <!-- Orbital dots -->
    <circle cx="-220" cy="-200" r="18" fill="#808080"/>
    <circle cx="220" cy="-200" r="18" fill="#808080"/>
    <circle cx="-260" cy="150" r="18" fill="#808080"/>
    <circle cx="260" cy="150" r="18" fill="#808080"/>
    <circle cx="0" cy="-380" r="18" fill="#808080"/>
  </g>
</svg>
